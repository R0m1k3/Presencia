name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push on a branch cancels its run in progress. On main runs are not
# cancelled but queued; GitHub keeps one queued run, so two quick merges may
# publish only the latest sha- tag (latest is always right).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: presencia
          POSTGRES_PASSWORD: presencia
          POSTGRES_DB: presencia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U presencia"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: presencia
      PGPASSWORD: presencia
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # Each test file recreates its own database: run them one at a time.
      - run: cargo test --locked -- --test-threads=1

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build

  image:
    needs: [test, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: presencia:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (container + database, API and UI)
        run: |
          docker network create smoke
          docker run -d --name db --network smoke -e POSTGRES_USER=presencia \
            -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=presencia postgres:16-alpine
          docker run -d --name api --network smoke -p 8080:80 -e PGHOST=db \
            -e PGPASSWORD=smoke -e ADMIN_PASSWORD=smoke-password \
            -e COOKIE_SECURE=false presencia:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/api/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/api/health
          docker exec api /app/presencia healthcheck
          # The real UI, not build.rs's placeholder, with its headers.
          curl -fsS -D headers.txt http://127.0.0.1:8080/ -o index.html
          grep -qi '^content-security-policy:' headers.txt
          grep -qi '^content-type: text/html; charset=utf-8' headers.txt
          if grep -qi 'interface non construite' index.html; then exit 1; fi
          js=$(grep -o '/assets/[^"]*\.js' index.html | head -1)
          test -n "$js"
          test "$(curl -fsS -o /dev/null -w '%{content_type}' "http://127.0.0.1:8080$js")" \
            = 'text/javascript; charset=utf-8'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: End-to-end tests (Playwright, on the image)
        working-directory: web
        env:
          BASE_URL: http://127.0.0.1:8080
          ADMIN_EMAIL: admin@presencia.local
          ADMIN_PASSWORD: smoke-password
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test --reporter=line,html
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            web/test-results
            web/playwright-report
          retention-days: 7
      - name: Container logs
        if: always()
        run: docker logs api || true
      - name: Tags
        if: github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/r0m1k3/presencia
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # org.opencontainers.image.source links the package to this repository.
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
