# Les secrets ne sont plus écrits ici : copiez .env.example en .env (à côté de
# ce fichier) et renseignez-le. docker compose lit .env automatiquement.
services:
  presencia-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: presencia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: presencia
    volumes:
      - presencia_pgdata:/var/lib/postgresql/data
    ports:
      # Reachable from this host only (psql, backups), not from the network.
      - "127.0.0.1:6543:5432"
    networks:
      - presencia_private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U presencia"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One container: the Rust binary serves the API and the web UI. It keeps the
  # old frontend's name and port 80 so the host's reverse proxy, which targets
  # presencia-frontend:80, needs no change.
  presencia-frontend:
    image: ghcr.io/r0m1k3/presencia:${PRESENCIA_TAG:-latest}
    restart: unless-stopped
    depends_on:
      presencia-db:
        condition: service_healthy
    environment:
      PORT: 80
      PGHOST: presencia-db
      PGPORT: 5432
      PGUSER: presencia
      PGPASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}
      PGDATABASE: presencia
      JWT_SECRET: ${JWT_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrateur}
    # Port 80 as the unprivileged user (Docker's default, made explicit).
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    healthcheck:
      test: ["CMD", "/app/presencia", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      # Host only: the reverse proxy reaches the container over nginx_default.
      - "127.0.0.1:8781:80"
    networks:
      - presencia_private
      - nginx

networks:
  # Shared with the host's reverse proxy: only the application joins it.
  nginx:
    name: nginx_default
    external: true
  # Private to this stack: the database is reachable only from the API. (Not
  # "internal: true", which would disable the 127.0.0.1 port mapping above.)
  presencia_private:

volumes:
  presencia_pgdata:
