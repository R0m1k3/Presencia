[package]
name = "presencia"
version = "2.0.0"
edition = "2024"
publish = false
build = "build.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "json"] }
serde = { version = "1", features = ["derive"] }
# Keys in insertion order: the front and the parity tool expect Node's order.
serde_json = { version = "1", features = ["preserve_order"] }
bcrypt = "0.17"
jsonwebtoken = "9"
rust_xlsxwriter = "0.102"
rand = "0.9"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
percent-encoding = "2"
unicode-normalization = "0.1"
hashlink = "0.10"
http-body-util = "0.1"
# Own accept loop (main.rs): axum::serve cannot set a header read timeout.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-graceful", "http1"] }
tower = { version = "0.5", features = ["util"] }
# The web UI (../web/dist) is compiled into the binary: one artefact, no volume.
rust-embed = "8"

[dev-dependencies]
http-body-util = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
lopdf = "0.34"

[profile.release]
lto = "thin"
strip = true
